# Built-in XenForo 2.x tags, with custom tags from the export below.
# RedGuides tags are bundled; export your own at admin.php?bb-codes.
# Uppercase tags and lowercase options match XenForo's editor.
paragraph_separator = "\n\n"
# Keep or strip unsupported HTML tags.
unknown_html = "keep"
# Letter case for custom tags too.
tag_case = "upper"
# [HEADING] anchors its own text, so "#section" links are pointed at it; "none" leaves them alone.
heading_anchors = "xenforo"
# Custom tag export; false disables custom tags (--no-custom-bbcode).
bb_codes = "bb_codes.xml"

[tags]
# inline
strong          = "[B]{text}[/B]"
emphasis        = "[I]{text}[/I]"
insert          = "[U]{text}[/U]"
strikethrough   = "[S]{text}[/S]"
# custom on most boards: mark, superscript, subscript, kbd, abbr, anchor, link_anchor, heading_link, pixelate, admonition
mark            = "{text}"
superscript     = "{text}"
subscript       = "{text}"
codespan        = "[ICODE]{text}[/ICODE]"
# <kbd>Ctrl</kbd>. An export holding <kbd>{text}</kbd> fills this in, to show a key cap.
kbd             = "[ICODE]{text}[/ICODE]"
# <q>
inline_quote    = "“{text}”"
inline_spoiler  = "[ISPOILER]{text}[/ISPOILER]"
abbr            = "{text}"
link            = "[URL={url}]{text}[/URL]"
# A link within a post needs a custom BB code, because XenForo shows [URL=#x] as plain text.
# An export holding <a href="#{option}">{text}</a> fills in link_anchor and heading_link, and one
# holding <a name="{option}">{text}</a> fills in anchor. Without them the text stays and the link goes.
# link_anchor and anchor are a matching pair, used for footnotes and for HTML <a name="x">.
link_anchor     = "{text}"
anchor          = "{text}"
# A link to a heading. [HEADING] writes the anchor itself, so only the link needs a tag.
heading_link    = "{text}"
email           = "[EMAIL]{address}[/EMAIL]"
# <font> and inline CSS
font_color      = "[COLOR={color}]{text}[/COLOR]"
font_size       = "[SIZE={size}]{text}[/SIZE]"
font_face       = "[FONT={face}]{text}[/FONT]"
image           ="[IMG]{url}[/IMG]"
# {options} lists what the image has, from alt, width, height and align: alt="Logo" width="200px"
image_options   = "[IMG {options}]{url}[/IMG]"
pixelate        = "{text}"
linebreak       = "\n"

# blocks
heading         = { 1 = "[HEADING=1]{text}[/HEADING]", 2 = "[HEADING=2]{text}[/HEADING]", 3 = "[HEADING=3]{text}[/HEADING]" }
thematic_break  = "[HR][/HR]"
block_code      = "[CODE={lang}]{text}[/CODE]"
block_code_nolang = "[CODE]{text}[/CODE]"
block_quote     = "[QUOTE]\n{text}[/QUOTE]"
block_quote_author = "[QUOTE=\"{author}\"]\n{text}[/QUOTE]"
admonition      = "[QUOTE][B]{label}:[/B] {text}[/QUOTE]"
# Options holding free text are quoted: XenForo reads a quoted option up to the first "]
# and the renderer removes quotes and line breaks from the value, so a title or alt may hold ].
block_spoiler   = "[SPOILER=\"{title}\"]{text}[/SPOILER]"
block_spoiler_notitle = "[SPOILER]{text}[/SPOILER]"
# <figcaption> and a table's <caption>, on a line of their own
caption         = "{text}"

# lists
list_ordered    = "[LIST=1]{text}[/LIST]"
list_unordered  = "[LIST]{text}[/LIST]"
list_item       = "[*]{text}"
task_checked    = "🗹 {text}"
task_unchecked  = "☐ {text}"
def_list        = "{text}"
def_list_head   = "[B]{text}[/B] :"
def_list_item   = "[INDENT]{text}[/INDENT]"

# tables
table           = "[TABLE]\n{text}[/TABLE]"
table_row       = "[TR]\n{text}[/TR]"
table_head_cell = "[TH]{text}[/TH]"
table_cell      = "[TD]{text}[/TD]"
align_left      = "[LEFT]{text}[/LEFT]"
align_center    = "[CENTER]{text}[/CENTER]"
align_right     = "[RIGHT]{text}[/RIGHT]"

# footnotes
footnote_ref    = "[U]{link}[/U]"
footnotes       = "[B]Footnotes:[/B]\n{text}"
footnote_item   = "{target}. {text}"
