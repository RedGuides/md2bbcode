# Built-in XenForo 2.x tags, with custom tags from the export below.
# RedGuides tags are bundled; export your own at admin.php?bb-codes.
# Uppercase tags and lowercase options match XenForo's editor.
name = "xenforo"
paragraph_separator = "\n\n"
# Keep or strip unsupported HTML tags.
unknown_html = "keep"
# Letter case for custom tags too.
tag_case = "upper"
# Custom tag export; false disables custom tags (--no-custom-bbcode).
bb_codes = "bb_codes.xml"

[tags]
# inline
strong          = "[B]{text}[/B]"
emphasis        = "[I]{text}[/I]"
insert          = "[U]{text}[/U]"
strikethrough   = "[S]{text}[/S]"
# custom on most boards: mark, superscript, subscript, abbr, anchor, pixelate, admonition
mark            = "{text}"
superscript     = "{text}"
subscript       = "{text}"
codespan        = "[ICODE]{text}[/ICODE]"
inline_spoiler  = "[ISPOILER]{text}[/ISPOILER]"
abbr            = "{text}"
link            = "[URL={url}]{text}[/URL]"
# HTML only, for now: <a href="#x">, <a name="x"> and <a href="mailto:...">.
link_anchor     = "[URL=#{anchor}]{text}[/URL]"
anchor          = "{text}"
email           = "[EMAIL]{address}[/EMAIL]"
# <font> and inline CSS
font_color      = "[COLOR={color}]{text}[/COLOR]"
font_size       = "[SIZE={size}]{text}[/SIZE]"
font_face       = "[FONT={face}]{text}[/FONT]"
image           ="[IMG]{url}[/IMG]"
image_alt       = "[IMG alt=\"{alt}\"]{url}[/IMG]"
pixelate        = "{text}"
linebreak       = "\n"

# blocks
heading         = { 1 = "[HEADING=1]{text}[/HEADING]", 2 = "[HEADING=2]{text}[/HEADING]", 3 = "[HEADING=3]{text}[/HEADING]" }
thematic_break  = "[HR][/HR]"
block_code      = "[CODE={lang}]{text}[/CODE]"
block_code_nolang = "[CODE]{text}[/CODE]"
block_quote     = "[QUOTE]\n{text}[/QUOTE]"
block_quote_author = "[QUOTE=\"{author}\"]\n{text}[/QUOTE]"
admonition      = "[QUOTE][B]{label}:[/B] {text}[/QUOTE]"
block_spoiler   = "[SPOILER={title}]{text}[/SPOILER]"
block_spoiler_notitle = "[SPOILER]{text}[/SPOILER]"
block_error     = "[COLOR=red][ICODE]{text}[/ICODE][/COLOR]"

# lists
list_ordered    = "[LIST=1]{text}[/LIST]"
list_unordered  = "[LIST]{text}[/LIST]"
list_item       = "[*]{text}"
task_checked    = "🗹 {text}"
task_unchecked  = "☐ {text}"
def_list        = "{text}"
def_list_head   = "[B]{text}[/B] :"
def_list_item   = "[INDENT]{text}[/INDENT]"

# tables
table           = "[TABLE]\n{text}[/TABLE]"
table_row       = "[TR]\n{text}[/TR]"
table_head_cell = "[TH]{text}[/TH]"
table_cell      = "[TD]{text}[/TD]"
align_left      = "[LEFT]{text}[/LEFT]"
align_center    = "[CENTER]{text}[/CENTER]"
align_right     = "[RIGHT]{text}[/RIGHT]"

# footnotes
footnote_ref    = "[U]{link}[/U]"
footnotes       = "[B]Footnotes:[/B]\n{text}"
footnote_item   = "{target}. {text}"
